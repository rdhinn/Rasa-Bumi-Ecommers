<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rasa Bumi - Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-gray-50 font-poppins">
    <!-- MAIN CONTENT -->
    <div class="max-w-sm mx-auto min-h-screen bg-white shadow-md">
      <!-- HEADER -->
      <header
        class="flex items-center justify-between px-4 py-4 border-b border-gray-200 sticky top-0 bg-white z-50"
      >
        <h1 class="text-xl font-bold text-amber-900">Profile</h1>
        <button class="text-gray-600 hover:text-amber-900">
          <a href="./setting.html"><i class="fa-solid fa-gear text-xl"></i></a>
        </button>
      </header>

      <!-- USER INFO -->
      <div class="flex flex-col items-center mt-6 mb-6 px-4">
        <img
          src="https://via.placeholder.com/100"
          alt="Avatar"
          class="w-24 h-24 rounded-full border-4 border-amber-600"
        />
        <h2 class="mt-3 text-lg font-semibold text-gray-800">Sinaga</h2>
        <p class="text-gray-500 text-sm">user@example.com</p>
      </div>

      <!-- PROFILE OPTIONS -->
      <div class="space-y-2 px-4">
        <button
          class="w-full flex justify-between items-center px-4 py-3 bg-white rounded-lg shadow-sm hover:shadow-md transition-shadow"
        >
          <div class="flex items-center gap-3">
            <i class="fa-solid fa-user text-gray-500"></i>
            <span class="text-gray-700 font-medium">Account Settings</span>
          </div>
          <i class="fa-solid fa-chevron-right text-gray-400"></i>
        </button>

        <button
          class="w-full flex justify-between items-center px-4 py-3 bg-white rounded-lg shadow-sm hover:shadow-md transition-shadow"
        >
          <div class="flex items-center gap-3">
            <i class="fa-solid fa-wallet text-gray-500"></i>
            <span class="text-gray-700 font-medium">Financial</span>
          </div>
          <i class="fa-solid fa-chevron-right text-gray-400"></i>
        </button>

        <button
          class="w-full flex justify-between items-center px-4 py-3 bg-white rounded-lg shadow-sm hover:shadow-md transition-shadow"
        >
          <div class="flex items-center gap-3">
            <i class="fa-solid fa-headset text-gray-500"></i>
            <span class="text-gray-700 font-medium">Support</span>
          </div>
          <i class="fa-solid fa-chevron-right text-gray-400"></i>
        </button>

        <button
          class="w-full flex justify-between items-center px-4 py-3 bg-white rounded-lg shadow-sm hover:shadow-md transition-shadow"
        >
          <div class="flex items-center gap-3">
            <i class="fa-solid fa-download text-gray-500"></i>
            <span class="text-gray-700 font-medium">App Updates</span>
          </div>
          <i class="fa-solid fa-chevron-right text-gray-400"></i>
        </button>

        <button
          class="w-full flex justify-between items-center px-4 py-3 bg-white rounded-lg shadow-sm hover:shadow-md transition-shadow text-red-500"
        >
          <div class="flex items-center gap-3">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span class="font-medium">Logout</span>
          </div>
        </button>
      </div>

      <!-- BOTTOM NAVIGATION -->
      <nav
        class="fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 shadow-inner flex justify-around items-center py-2"
      >
        <button
          class="flex flex-col items-center text-gray-500"
          onclick="location.href='index.html'"
        >
          <i class="fa-solid fa-house text-xl"></i>
          <span class="text-xs">Home</span>
        </button>

        <button class="flex flex-col items-center text-gray-500 relative">
          <i class="fa-solid fa-cart-shopping text-xl"></i>
          <span class="text-xs">Keranjang</span>
        </button>

        <button class="flex flex-col items-center text-amber-600">
          <i class="fa-regular fa-user text-xl"></i>
          <span class="text-xs">Profile</span>
        </button>
      </nav>
    </div>
  </body>
</html>
