<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rasa Bumi - Home</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="mobile-container">
        <header class="app-header">
            <div class="header-left">
                <div class="logo-text">Rasa Bumi</div>
            </div>
            <div class="header-right">
                <span class="icon cart-icon">🛒</span> <span class="cart-count">0</span> </div>
        </header>

        <section class="hero-section">
            <img src="https://via.placeholder.com/450x180/FF8C00/FFFFFF?text=Ubi+Cilembu+Panggang" alt="Ubi Cilembu Panggang" class="hero-image">
            <h1 class="hero-title">Pati Manis dari Tanah Nusantara</h1>
        </section>

        <section class="category-section">
            <h2>Pilih Kategori</h2>
            <div class="category-list">
                <div class="category-item" data-category="ubi-segar">Ubi Segar</div>
                <div class="category-item active" data-category="siap-santap">Siap Santap</div>
                <div class="category-item" data-category="paket-hemat">Paket Hemat</div>
                <div class="category-item" data-category="promo">Promo</div>
            </div>
        </section>

        <section class="product-section">
            <h2>Produk Unggulan</h2>
            <div class="product-grid">
                <div class="product-card" data-category="siap-santap">
                    <img src="https://via.placeholder.com/180x120/FF8C00/FFFFFF?text=Ubi+Medium" alt="Ubi Medium" class="product-image">
                    <p class="product-name">Ubi Panggang Medium</p>
                    <p class="product-price">Rp 35.000</p>
                    <button class="add-to-cart-btn">Tambah +</button>
                </div>
                <div class="product-card" data-category="siap-santap">
                    <img src="https://via.placeholder.com/180x120/FF8C00/FFFFFF?text=Ubi+1+Kg" alt="Ubi 1 Kg" class="product-image">
                    <p class="product-name">Ubi Panggang 1 Kg</p>
                    <p class="product-price">Rp 65.000</p>
                    <button class="add-to-cart-btn">Tambah +</button>
                </div>
                <div class="product-card" data-category="ubi-segar" style="display: none;">
                    <img src="https://via.placeholder.com/180x120/FF8C00/FFFFFF?text=Ubi+Segar" alt="Ubi Segar" class="product-image">
                    <p class="product-name">Ubi Cilembu Segar 500gr</p>
                    <p class="product-price">Rp 25.000</p>
                    <button class="add-to-cart-btn">Tambah +</button>
                </div>
            </div>
        </section>

        <nav class="bottom-nav">
            <a href="#" class="nav-item active" data-nav="home">🏡 Home</a>
            <a href="#" class="nav-item" data-nav="search">🔍 Cari</a>
            <a href="#" class="nav-item" data-nav="cart">🛒 Keranjang</a>
            <a href="#" class="nav-item" data-nav="profile">👤 Profil</a>
        </nav>

    </div>

    <script src="script.js"></script>
</body>
</html>
