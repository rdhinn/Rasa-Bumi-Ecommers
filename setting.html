<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pengaturan & Bantuan Modern</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-gray-50 font-poppins">
    <!-- HEADER -->
    <header
      class="flex items-center px-4 gap-3 py-3 border-b border-gray-200 sticky top-0 bg-white z-50"
    >
      <a href="./index.html">
        <i
          class="fa-solid fa-arrow-left text-xl text-gray-600 cursor-pointer hover:text-amber-900 transition-colors"
        ></i
      ></a>
      <h1 class="text-xl font-bold text-amber-900">Pengaturan & Bantuan</h1>
    </header>

    <main class="max-w-sm mx-auto mt-4 space-y-6 p-4">
      <!-- Section: Settings Hub -->
      <div class="space-y-2">
        <h2 class="text-gray-400 text-sm font-semibold">Settings Hub</h2>
        <div class="bg-white rounded-xl shadow-md overflow-hidden">
          <!-- Account -->
          <div class="border-b border-gray-100">
            <button
              class="w-full px-4 py-4 flex justify-between items-center hover:bg-gray-50 transition-colors"
              onclick="toggleContent('account', this)"
            >
              <div class="flex items-center gap-3 text-gray-700 font-medium">
                <i class="fa-solid fa-user"></i> Account
              </div>
              <i
                class="fa-solid fa-chevron-down text-gray-400 transition-transform duration-300"
              ></i>
            </button>
            <div
              id="account"
              class="max-h-0 overflow-hidden px-4 transition-all duration-300 text-gray-600"
            >
              <p class="py-2">Detail profil, password, keamanan, dll.</p>
            </div>
          </div>

          <!-- Financial -->
          <div class="border-b border-gray-100">
            <button
              class="w-full px-4 py-4 flex justify-between items-center hover:bg-gray-50 transition-colors"
              onclick="toggleContent('financial', this)"
            >
              <div class="flex items-center gap-3 text-gray-700 font-medium">
                <i class="fa-solid fa-wallet"></i> Financial
              </div>
              <i
                class="fa-solid fa-chevron-down text-gray-400 transition-transform duration-300"
              ></i>
            </button>
            <div
              id="financial"
              class="max-h-0 overflow-hidden px-4 transition-all duration-300 text-gray-600"
            >
              <p class="py-2">Informasi pembayaran, langganan, dll.</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Section: Support & FAQs -->
      <div class="space-y-2">
        <h2 class="text-gray-400 text-sm font-semibold">Support & FAQs</h2>
        <div class="bg-white rounded-xl shadow-md overflow-hidden">
          <!-- FAQ -->
          <div class="border-b border-gray-100">
            <button
              class="w-full px-4 py-4 flex justify-between items-center hover:bg-gray-50 transition-colors"
              onclick="toggleContent('faq', this)"
            >
              <div class="flex items-center gap-3 text-gray-700 font-medium">
                <i class="fa-solid fa-magnifying-glass"></i> Search FAQ
              </div>
              <i
                class="fa-solid fa-chevron-down text-gray-400 transition-transform duration-300"
              ></i>
            </button>
            <div
              id="faq"
              class="max-h-0 overflow-hidden px-4 transition-all duration-300 text-gray-600"
            >
              <p class="py-2">FAQ tentang aplikasi, promo, dan akun.</p>
            </div>
          </div>

          <!-- Support -->
          <div class="border-b border-gray-100">
            <button
              class="w-full px-4 py-4 flex justify-between items-center hover:bg-gray-50 transition-colors"
              onclick="toggleContent('support', this)"
            >
              <div class="flex items-center gap-3 text-gray-700 font-medium">
                <i class="fa-solid fa-headset"></i> Contact Support
              </div>
              <i
                class="fa-solid fa-chevron-down text-gray-400 transition-transform duration-300"
              ></i>
            </button>
            <div
              id="support"
              class="max-h-0 overflow-hidden px-4 transition-all duration-300 text-gray-600"
            >
              <p class="py-2">Hubungi tim support kami via email atau chat.</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Section: App -->
      <div class="space-y-2">
        <h2 class="text-gray-400 text-sm font-semibold">App</h2>
        <div class="bg-white rounded-xl shadow-md overflow-hidden">
          <!-- Updates -->
          <div>
            <button
              class="w-full px-4 py-4 flex justify-between items-center hover:bg-gray-50 transition-colors"
              onclick="toggleContent('updates', this)"
            >
              <div class="flex items-center gap-3 text-gray-700 font-medium">
                <i class="fa-solid fa-download"></i> App Updates
              </div>
              <i
                class="fa-solid fa-chevron-down text-gray-400 transition-transform duration-300"
              ></i>
            </button>
            <div
              id="updates"
              class="max-h-0 overflow-hidden px-4 transition-all duration-300 text-gray-600"
            >
              <p class="py-2">Versi terbaru aplikasi dan catatan rilis.</p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script>
      function toggleContent(id, btn) {
        const content = document.getElementById(id);
        const icon = btn.querySelector("i.fa-chevron-down");

        if (content.style.maxHeight && content.style.maxHeight !== "0px") {
          content.style.maxHeight = "0px";
          icon.style.transform = "rotate(0deg)";
        } else {
          content.style.maxHeight = content.scrollHeight + "px";
          icon.style.transform = "rotate(180deg)";
        }
      }
    </script>
  </body>
</html>
